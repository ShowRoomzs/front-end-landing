# main에 올라오면 빌드해서 S3(showroomz.co.kr 랜딩)에 올리고 CloudFront 캐시를 비운다.
# 랜딩 AWS 정보가 오기 전(vars.S3_BUCKET 비어 있음)에는 배포 작업을 건너뛴다.
# AWS 접근은 OIDC 역할로 한다 — 액세스 키를 저장소에 두지 않는다.
# 저장소 설정: secrets.AWS_ROLE_ARN · vars.S3_BUCKET · vars.CLOUDFRONT_DISTRIBUTION_ID
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.S3_BUCKET != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 배포 설정이 하나라도 비면 빌드 전에 멈춘다
      - name: Check settings
        run: |
          for v in S3_BUCKET CLOUDFRONT_DISTRIBUTION_ID AWS_ROLE_ARN; do
            [ -n "${!v}" ] || { echo "::error::$v is not set"; exit 1; }
          done
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      # 해시 붙은 assets는 오래 캐시하고, index.html 등 나머지는 매번 다시 확인하게 한다
      - name: Upload to S3
        run: |
          aws s3 sync dist/assets "s3://${{ vars.S3_BUCKET }}/assets" --delete \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist "s3://${{ vars.S3_BUCKET }}" --delete --exclude "assets/*" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
